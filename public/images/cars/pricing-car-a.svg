<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="suvBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="60%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="suvGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <g id="suv-car">
    <!-- Underbody cladding -->
    <path d="M 160 410 L 840 410 L 850 395 L 150 395 Z" fill="#0A0E14" />
    <!-- Upright SUV Body -->
    <path d="M 110 375 C 115 340 140 320 200 320 C 250 320 280 335 320 330 C 370 310 440 210 560 190 C 700 170 800 190 840 240 C 880 290 890 350 880 380 L 840 390 C 830 360 800 330 750 330 C 700 330 670 360 660 390 L 330 390 C 320 360 290 330 240 330 C 190 330 160 360 150 390 Z" fill="url(#suvBody)" stroke="#64748B" stroke-width="2" />
    <!-- Windows -->
    <path d="M 350 320 C 390 250 450 200 560 195 C 670 190 730 220 780 310 Z" fill="url(#suvGlass)" stroke="#0F172A" stroke-width="2" />
    <!-- Roof Rails -->
    <path d="M 440 190 L 750 185" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round" />
    <!-- Front Wheel -->
    <circle cx="240" cy="385" r="60" fill="#0A0E14" />
    <circle cx="240" cy="385" r="42" fill="#334155" stroke="#94A3B8" stroke-width="3" />
    <circle cx="240" cy="385" r="12" fill="#0F172A" />
    <!-- Rear Wheel -->
    <circle cx="750" cy="385" r="60" fill="#0A0E14" />
    <circle cx="750" cy="385" r="42" fill="#334155" stroke="#94A3B8" stroke-width="3" />
    <circle cx="750" cy="385" r="12" fill="#0F172A" />
  </g>
</svg>
