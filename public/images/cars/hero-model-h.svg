<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bodyGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#F1F5F9" />
      <stop offset="85%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="headlightBeam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Car Silhouette: Model H ZX Luxury Sedan (Transparent background cutout) -->
  <g id="car-body">
    <!-- Underbody dark trim -->
    <path d="M 220 450 L 980 450 L 990 435 L 210 435 Z" fill="#0A0E14" />

    <!-- Main Chassis Body -->
    <path d="M 140 420 C 145 390 175 365 240 365 C 295 365 330 380 375 375 C 440 370 540 260 670 240 C 810 220 920 280 990 340 C 1040 380 1070 410 1060 435 L 1000 445 C 990 410 950 380 890 380 C 830 380 790 410 780 445 L 420 445 C 410 410 370 380 310 380 C 250 380 210 410 200 445 L 140 435 Z" fill="url(#bodyGradWhite)" stroke="#94A3B8" stroke-width="2" />

    <!-- Sleek Greenhouse (Roofline & Windows) -->
    <path d="M 400 365 C 450 300 520 250 660 245 C 780 240 850 280 910 355 Z" fill="url(#glassGrad)" stroke="#1E293B" stroke-width="3" />
    <!-- Pillar Divider (B-Pillar) -->
    <path d="M 650 245 L 635 365" stroke="#0F172A" stroke-width="8" stroke-linecap="round" />
    <path d="M 780 260 L 760 365" stroke="#0F172A" stroke-width="6" stroke-linecap="round" />

    <!-- Sharp Character Shoulder Line -->
    <path d="M 180 400 C 350 390 650 380 1040 370" stroke="#FFFFFF" stroke-width="3" opacity="0.9" />
    <path d="M 220 415 C 450 405 750 395 1020 385" stroke="#94A3B8" stroke-width="1.5" opacity="0.6" />

    <!-- Chrome Window Surrounds -->
    <path d="M 395 365 C 445 295 515 245 660 240 C 785 235 855 275 915 355" stroke="#E2E8F0" stroke-width="2.5" fill="none" />

    <!-- LED Headlight Jewel Array -->
    <path d="M 150 415 L 220 400 L 230 420 Z" fill="#E0F2FE" />
    <path d="M 140 420 L 190 415" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />
    
    <!-- LED Tail Light Sleek Bar -->
    <path d="M 1030 380 L 1060 410 L 1030 415 Z" fill="#EF4444" opacity="0.85" />

    <!-- Front Wheel Well & Tire -->
    <g id="front-wheel">
      <circle cx="310" cy="440" r="72" fill="#0A0E14" />
      <circle cx="310" cy="440" r="54" fill="url(#rimGrad)" stroke="#475569" stroke-width="3" />
      <!-- 5-Spoke Dual-Tone Diamond Cut Alloy -->
      <line x1="310" y1="440" x2="310" y2="390" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
      <line x1="310" y1="440" x2="355" y2="425" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
      <line x1="310" y1="440" x2="340" y2="475" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
      <line x1="310" y1="440" x2="280" y2="475" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
      <line x1="310" y1="440" x2="265" y2="425" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
      <circle cx="310" cy="440" r="14" fill="#0F172A" stroke="#94A3B8" stroke-width="2" />
    </g>

    <!-- Rear Wheel Well & Tire -->
    <g id="rear-wheel">
      <circle cx="890" cy="440" r="72" fill="#0A0E14" />
      <circle cx="890" cy="440" r="54" fill="url(#rimGrad)" stroke="#475569" stroke-width="3" />
      <!-- 5-Spoke Dual-Tone Diamond Cut Alloy -->
      <line x1="890" y1="440" x2="890" y2="390" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
      <line x1="890" y1="440" x2="935" y2="425" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
      <line x1="890" y1="440" x2="920" y2="475" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
      <line x1="890" y1="440" x2="860" y2="475" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
      <line x1="890" y1="440" x2="845" y2="425" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
      <circle cx="890" cy="440" r="14" fill="#0F172A" stroke="#94A3B8" stroke-width="2" />
    </g>

    <!-- Side Mirror -->
    <path d="M 430 355 C 420 345 440 340 465 345 L 475 358 Z" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5" />
    <!-- Door Handles -->
    <rect x="530" y="380" width="28" height="6" rx="3" fill="#E2E8F0" stroke="#64748B" stroke-width="1" />
    <rect x="710" y="380" width="28" height="6" rx="3" fill="#E2E8F0" stroke="#64748B" stroke-width="1" />
  </g>
</svg>
